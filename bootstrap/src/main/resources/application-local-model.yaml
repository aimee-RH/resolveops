# Generation only: database, authentication, storage and embeddings need separate setup.
support:
  investigation:
    enabled: ${RESOLVEOPS_INVESTIGATION_ENABLED:false}
  repair:
    enabled: ${RESOLVEOPS_REPAIR_ENABLED:false}

rag:
  rerank:
    enabled: false
  search:
    evidence:
      min-rerank-score: 0

agent:
  chat:
    provider: ollama
    model: ${RESOLVEOPS_LOCAL_MODEL:resolveops-qwen3:4b}
    temperature: 0
    reasoning-effort: ${RESOLVEOPS_REASONING_EFFORT:low}
  mcp:
    servers: []
  max-iters: 4
  max-retries: 1
  max-concurrent-runs-per-user: 1
  memory:
    context-window-chars: 12000
    summary-enabled: false
    long-term-enabled: false

ai:
  rerank:
    default-model: resolveops-local-rerank
    candidates:
      - id: resolveops-local-rerank
        provider: noop
        model: noop
  providers:
    ollama:
      url: http://127.0.0.1:11434
      api-key: ollama-local
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings
  chat:
    candidates:
      - id: resolveops-local
        provider: ollama
        model: ${RESOLVEOPS_LOCAL_MODEL:resolveops-qwen3:4b}
      - id: resolveops-local-thinking
        provider: ollama
        model: resolveops-qwen3:4b
        supports-thinking: true
    tiers:
      fast:
        candidates: [resolveops-local]
        timeout-ms: 120000
      standard:
        candidates: [resolveops-local]
        timeout-ms: 120000
      deep:
        candidates: [resolveops-local-thinking]
        timeout-ms: 120000
