name: ResolveOps M1

on:
  push:
    branches: [codex/resolveops]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resolveops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  read-boundary:
    name: Build and read boundary (G1-G2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Support PostgreSQL, HTTP and native tool checks
        run: mvn -B -ntp -pl agent -am '-Dtest=Support*Test,RunbookEvidenceSearchTest' -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Complete reactor integration
        run: mvn -B -ntp -DskipTests compile
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resolveops-junit
          path: |
            support/target/surefire-reports/
            rag/target/surefire-reports/TEST-*RunbookEvidenceSearch*
            agent/target/surefire-reports/TEST-*SupportReadTools*
          retention-days: 7
  workbench:
    name: Workbench types and build (G1)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build
